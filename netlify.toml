# Netlify buduje stronę automatycznie po każdej publikacji z panelu (/admin)
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Stary adres Netlify przekierowuje na domenę klubu
[[redirects]]
  from = "https://uks-posejdon-pultusk.netlify.app/*"
  to = "https://posejdonpultusk.pl/:splat"
  status = 301
  force = true
